<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shorya Art Studio — Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f2eb;color:#211b17;font-family:Arial,sans-serif}.top{background:#211b17;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:21px;font-weight:800}.sub{font-size:12px;opacity:.7;margin-top:4px}.wrap{max-width:1250px;margin:24px auto;padding:0 16px}.panel,.stat,.order{background:#fff;border:1px solid #e5dbcf;border-radius:16px;box-shadow:0 8px 30px #2b1b0d0b}.login{max-width:430px;margin:55px auto;padding:25px}.login h1{margin-top:0}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.toolbar input,.toolbar select{width:100%;padding:12px;border:1px solid #d8cbbb;border-radius:9px;background:#fff}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#211b17;color:#fff}.gold{background:#d9a441;color:#211b17}.danger{background:#ffe0e0}.success{background:#dff6df}.muted{color:#71665e;font-size:13px;line-height:1.5}.error{color:#b42318;font-size:13px;min-height:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:18px}.stat span{font-size:13px;color:#71665e}.stat b{display:block;font-size:28px;margin-top:7px}.toolbar{display:grid;grid-template-columns:1fr 180px auto auto;gap:10px;margin:20px 0}.orders{display:grid;gap:15px}.order{padding:18px}.order-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.id{font-weight:800;font-size:18px}.date{font-size:12px;color:#786d62;margin-top:4px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}.pending{background:#fff1c7}.confirmed{background:#dff6df}.rejected{background:#ffe0e0}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:16px 0}.row{background:#faf8f4;padding:10px;border-radius:9px;font-size:14px;word-break:break-word}.row strong{font-size:11px;text-transform:uppercase;color:#786d62}.links,.actions{display:flex;flex-wrap:wrap;gap:8px}.link,.actions button{display:inline-block;border:0;border-radius:9px;padding:10px 12px;text-decoration:none;font-weight:700;cursor:pointer}.link{background:#211b17;color:#fff}.empty{text-align:center;padding:45px;color:#786d62}.top button{background:#fff;color:#211b17}.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:18px;background:#211b17;color:#fff;padding:12px 15px;border-radius:10px;display:none;z-index:20}.spinner{display:none;margin-left:8px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.details{grid-template-columns:1fr}}@media(max-width:520px){.toolbar{grid-template-columns:1fr}.top{align-items:flex-start}.order-head{flex-direction:column}}
</style>
</head>
<body>
<header class="top">
  <div><div class="brand">🎨 SHORYA ART STUDIO</div><div class="sub">Secure Supabase Admin Order Panel</div></div>
  <button id="logoutBtn" class="btn hidden" onclick="logout()">Logout</button>
</header>

<main class="wrap">
  <section id="loginPanel" class="panel login">
    <h1>Admin Login</h1>
    <p class="muted">Only the authorized admin account can view and update customer orders.</p>
    <div class="field"><label>Email</label><input id="email" type="email" value="Kardams053@gmail.com" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter your Supabase password"></div>
    <button class="btn primary" style="width:100%" onclick="login()">Login <span id="loginSpin" class="spinner">…</span></button>
    <div id="loginError" class="error"></div>
  </section>

  <section id="dashboard" class="hidden">
    <div class="stats">
      <div class="stat"><span>Total Orders</span><b id="total">0</b></div>
      <div class="stat"><span>Pending</span><b id="pending">0</b></div>
      <div class="stat"><span>Confirmed</span><b id="confirmed">0</b></div>
      <div class="stat"><span>Rejected</span><b id="rejected">0</b></div>
    </div>
    <div class="toolbar">
      <input id="search" placeholder="Search order ID, customer, WhatsApp" oninput="render()">
      <select id="filter" onchange="render()"><option value="ALL">All orders</option><option value="PENDING">Pending</option><option value="CONFIRMED">Confirmed</option><option value="REJECTED">Rejected</option></select>
      <button class="btn primary" onclick="loadOrders()">↻ Refresh</button>
      <button class="btn gold" onclick="exportOrders()">Export JSON</button>
    </div>
    <p id="loadError" class="error"></p>
    <section id="orders" class="orders"></section>
  </section>
</main>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://axyojwdqtcirqpjjyjsu.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_vFqkuKQnOkDrVUBbjRZ9kw_OugGwuLg";
const ADMIN_EMAIL = "Kardams053@gmail.com";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let orders = [];

function esc(v){return String(v ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function money(v){return '₹' + Number(v||0).toLocaleString('en-IN');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2200);}
function setError(id,msg){document.getElementById(id).textContent=msg||'';}

async function login(){
  setError('loginError','');
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  if(email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()) return setError('loginError','Use the authorized admin email.');
  if(!password) return setError('loginError','Enter your password.');
  document.getElementById('loginSpin').style.display='inline';
  try{
    const {error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error) throw error;
    const {data:{user}}=await supabaseClient.auth.getUser();
    if(!user || user.email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){
      await supabaseClient.auth.signOut();
      throw new Error('This account is not authorized for the admin panel.');
    }
    showDashboard();
    await loadOrders();
  }catch(e){setError('loginError',e.message||'Login failed.');}
  finally{document.getElementById('loginSpin').style.display='none';}
}

async function checkSession(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(session && session.user && session.user.email && session.user.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()){
    showDashboard();
    await loadOrders();
  } else if(session){await supabaseClient.auth.signOut();}
}
function showDashboard(){document.getElementById('loginPanel').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');document.getElementById('logoutBtn').classList.remove('hidden');}
async function logout(){await supabaseClient.auth.signOut();orders=[];document.getElementById('dashboard').classList.add('hidden');document.getElementById('logoutBtn').classList.add('hidden');document.getElementById('loginPanel').classList.remove('hidden');document.getElementById('password').value='';}

async function loadOrders(){
  setError('loadError','');
  document.getElementById('orders').innerHTML='<div class="panel empty">Loading orders…</div>';
  const {data,error}=await supabaseClient.from('orders').select('*').order('created_at',{ascending:false});
  if(error){orders=[];setError('loadError','Could not load orders: '+error.message);document.getElementById('orders').innerHTML='';return;}
  orders=data||[];render();
}

function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.getElementById('filter').value;
  document.getElementById('total').textContent=orders.length;
  document.getElementById('pending').textContent=orders.filter(o=>o.status==='PENDING').length;
  document.getElementById('confirmed').textContent=orders.filter(o=>o.status==='CONFIRMED').length;
  document.getElementById('rejected').textContent=orders.filter(o=>o.status==='REJECTED').length;
  const data=orders.filter(o=>{
    const text=[o.order_id,o.customer_name,o.whatsapp,o.country,o.artwork,o.address].join(' ').toLowerCase();
    return (f==='ALL'||o.status===f)&&text.includes(q);
  });
  const box=document.getElementById('orders');
  if(!data.length){box.innerHTML='<div class="panel empty">No orders found.</div>';return;}
  box.innerHTML=data.map(o=>{
    const status=(o.status||'PENDING').toUpperCase();
    const created=o.created_at?new Date(o.created_at).toLocaleString('en-IN'):'—';
    const wa=(o.whatsapp||'').replace(/[^0-9]/g,'');
    return `<article class="order">
      <div class="order-head"><div><div class="id">${esc(o.order_id||o.id)}</div><div class="date">${esc(created)}</div></div><span class="badge ${status.toLowerCase()}">${esc(status)}</span></div>
      <div class="details">
        <div class="row"><strong>Customer</strong><br>${esc(o.customer_name)}</div>
        <div class="row"><strong>WhatsApp</strong><br>${esc(o.whatsapp)} ${wa?`<a href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">Open WhatsApp</a>`:''}</div>
        <div class="row"><strong>Artwork</strong><br>${esc(o.artwork)}</div>
        <div class="row"><strong>People</strong><br>${esc(o.people)}</div>
        <div class="row"><strong>Total</strong><br>${money(o.total)}</div>
        <div class="row"><strong>Payment</strong><br>${esc(o.payment_option)}</div>
        <div class="row"><strong>Country</strong><br>${esc(o.country)}</div>
        <div class="row"><strong>Address</strong><br>${esc(o.address)}</div>
        <div class="row" style="grid-column:1/-1"><strong>Instructions</strong><br>${esc(o.instructions||'None')}</div>
      </div>
      <div class="links">
        ${o.reference_url?`<a class="link" href="${esc(o.reference_url)}" target="_blank" rel="noopener">📷 Reference Photo</a>`:''}
        ${o.payment_screenshot_url?`<a class="link" href="${esc(o.payment_screenshot_url)}" target="_blank" rel="noopener">💳 Payment Screenshot</a>`:''}
      </div>
      <div class="actions" style="margin-top:10px">
        <button class="success" onclick="setStatus('${esc(o.id)}','CONFIRMED')">✅ Confirm Order</button>
        <button class="danger" onclick="setStatus('${esc(o.id)}','REJECTED')">❌ Reject Order</button>
        ${status!=='PENDING'?`<button class="btn" style="background:#eee5d8" onclick="setStatus('${esc(o.id)}','PENDING')">↩ Mark Pending</button>`:''}
      </div>
    </article>`;
  }).join('');
}

async function setStatus(id,status){
  const {error}=await supabaseClient.from('orders').update({status}).eq('id',id);
  if(error){alert('Status update failed: '+error.message);return;}
  const item=orders.find(o=>o.id===id);if(item)item.status=status;
  render();toast('Order marked '+status+'.');
}

function exportOrders(){
  const blob=new Blob([JSON.stringify(orders,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='shorya-orders.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_OUT'){document.getElementById('dashboard').classList.add('hidden');document.getElementById('logoutBtn').classList.add('hidden');document.getElementById('loginPanel').classList.remove('hidden');}
});
checkSession();
</script>
</body>
</html>
