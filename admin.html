<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shorya Art Studio — Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f6f2eb;color:#211b17;font-family:Arial,sans-serif}.top{background:#211b17;color:#fff;padding:20px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e5dccf;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 24px #00000008}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;padding:16px;border-radius:14px}.stat b{font-size:25px;display:block;margin-top:5px}.btn{border:0;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:700}.dark{background:#211b17;color:#fff}.ok{background:#dff6df}.bad{background:#ffe0e0}.muted{color:#71675e;font-size:13px}.login{max-width:420px;margin:60px auto}.input{width:100%;padding:12px;border:1px solid #d8cbbb;border-radius:9px;margin:7px 0 12px;box-sizing:border-box}.orderhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.links a{display:inline-block;margin:4px 8px 4px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><header class="top"><div><b>🎨 Shorya Art Studio</b><div class="muted" style="color:#cfc7bf">Admin Order Panel</div></div><button class="btn" onclick="logout()">Logout</button></header><main class="wrap"><section id="login" class="card login"><h2>Admin Login</h2><p class="muted">Use your Supabase admin email and password.</p><input id="email" class="input" type="email" placeholder="Admin email"><input id="password" class="input" type="password" placeholder="Password"><button class="btn dark" onclick="login()">Login</button><p id="loginMsg" class="muted"></p></section><section id="app" style="display:none"><div class="grid"><div class="stat">Total<b id="total">0</b></div><div class="stat">Pending<b id="pending">0</b></div><div class="stat">Confirmed<b id="confirmed">0</b></div><div class="stat">Rejected<b id="rejected">0</b></div></div><div class="card"><button class="btn dark" onclick="loadOrders()">↻ Refresh Orders</button> <button class="btn" onclick="enableNotify()">🔔 Enable Notifications</button><span id="notice" class="muted"></span></div><div id="orders"></div></section></main><script>const SUPABASE_URL='https://axyojwdqtcirqpjjyjsu.supabase.co';const SUPABASE_KEY='sb_publishable_vFqkuKQnOkDrVUBbjRZ9kw_OugGwuLg';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let known=new Set();let first=true;async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error){document.getElementById('loginMsg').textContent=error.message;return}showApp()}async function showApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';await loadOrders();setInterval(loadOrders,10000)}async function logout(){await sb.auth.signOut();location.reload()}async function enableNotify(){if(!('Notification'in window)){alert('Browser notifications are not supported.');return}const p=await Notification.requestPermission();document.getElementById('notice').textContent=p==='granted'?' Notifications enabled ✓':' Notifications not enabled.'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function loadOrders(){const {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(100);if(error){document.getElementById('orders').innerHTML='<div class="card">'+esc(error.message)+'</div>';return}document.getElementById('total').textContent=data.length;document.getElementById('pending').textContent=data.filter(x=>x.status==='PENDING').length;document.getElementById('confirmed').textContent=data.filter(x=>x.status==='CONFIRMED').length;document.getElementById('rejected').textContent=data.filter(x=>x.status==='REJECTED').length;if(!first){const fresh=data.filter(x=>!known.has(x.id));if(fresh.length&&Notification.permission==='granted'){fresh.forEach(x=>new Notification('New Shorya Art Order',{body:x.order_id+' • '+x.customer_name}))} }known=new Set(data.map(x=>x.id));first=false;document.getElementById('orders').innerHTML=data.map(render).join('')||'<div class="card">No orders yet.</div>'}function render(o){return `<article class="card"><div class="orderhead"><b>${esc(o.order_id)}</b><span>${esc(o.status)}</span></div><p><b>${esc(o.customer_name)}</b> • ${esc(o.whatsapp)} • ${esc(o.country)}</p><p>${esc(o.artwork)} • ${esc(o.size)} • ${esc(o.people)} person(s) • ₹${esc(o.total)}</p><p>${esc(o.address)}</p><p class="muted">${esc(o.instructions||'No special instructions')}<br>${esc(o.created_at)}</p><div class="links"><a href="${esc(o.reference_url)}" target="_blank">📸 Reference photo</a><a href="${esc(o.payment_screenshot_url)}" target="_blank">💳 Payment screenshot</a></div><div class="actions"><button class="btn ok" onclick="setStatus('${o.id}','CONFIRMED')">✓ Confirm</button><button class="btn bad" onclick="setStatus('${o.id}','REJECTED')">✕ Reject</button></div></article>`}async function setStatus(id,status){const {error}=await sb.from('orders').update({status}).eq('id',id);if(error)alert(error.message);else loadOrders()}sb.auth.getSession().then(({data})=>{if(data.session)showApp()})</script></body></html>
